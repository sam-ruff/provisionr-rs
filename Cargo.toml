[package]
name = "provisionr"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
axum-server = "0.9.2"
ctrlc = "3.5.3"
tokio-util = "0.7.20"
once_cell = "1.21.4"
async-trait = "0.1.92"
log = "0.4.35"
env_logger = "0.11.12"
serde = { version = "1.0.229", features = ["derive"] }
rust-embed = "8.14.0"
mime_guess = "2.0.5"
yaml-rust2 = { version = "0.13.2", default-features = false }
minijinja = "3.1.0"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
sha-crypt = { version = "0.6.0", features = ["getrandom"] }
yescrypt = "0.1.0"
dashmap = "6.2.1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }

[dev-dependencies]
ctor = "1.0.14"
dtor = "1.0.7"
mockall = "0.15.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
serde_json = "1.0.154"
